name: CI

# Spec Section 7.2's Phase 0 "CI/CD pipeline" deliverable. GitHub Actions is
# the default here since it needs no separate account/credentials to author
# — it activates automatically the moment this repo gets a GitHub remote,
# with nothing further to configure. Swap providers later if SI prefers
# GitLab CI/Jenkins/etc.; the steps below translate directly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test
