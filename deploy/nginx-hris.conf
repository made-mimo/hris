# nginx server block for SI HRIS (production, PHP-FPM). Replace hris.example.com, paths and the FPM socket.
server {
    listen 80;
    server_name hris.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hris.example.com;
    root /var/www/hris/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/hris.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hris.example.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
