# Follows the same convention already used for pim-test.conf / orangehrm-dev.conf
# in /etc/apache2/sites-available on this machine: its own port, its own
# DocumentRoot under /var/www/html, AllowOverride All for Laravel's .htaccess.
#
# Install (see PLAN.md §6 for the full sequence — all steps need root):
#   sudo cp -r /home/michael/Downloads/HRIS/app /var/www/html/hris
#   sudo chown -R www-data:www-data /var/www/html/hris
#   sudo cp /var/www/html/hris/deploy/apache-hris.conf /etc/apache2/sites-available/hris-dev.conf
#   sudo a2ensite hris-dev.conf
#   sudo systemctl reload apache2
#
# Then point .env's APP_URL at http://localhost:8083 and re-run `php artisan config:clear`.

Listen 8083

<VirtualHost *:8083>
    DocumentRoot /var/www/html/hris/public
    ServerName localhost

    <Directory /var/www/html/hris/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/hris-dev-error.log
    CustomLog ${APACHE_LOG_DIR}/hris-dev-access.log combined
</VirtualHost>
