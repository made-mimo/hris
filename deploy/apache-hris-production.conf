# Apache virtual host for SI HRIS (production). Replace hris.example.com and the certificate paths.
# Requires: a2enmod rewrite headers ssl && PHP 8.3 (libapache2-mod-php8.3 or php8.3-fpm).
<VirtualHost *:80>
    ServerName hris.example.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName hris.example.com
    DocumentRoot /var/www/hris/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/hris.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hris.example.com/privkey.pem

    <Directory /var/www/hris/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Never serve anything outside public/
    <DirectoryMatch "^/var/www/hris/(?!public)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/hris-error.log
    CustomLog ${APACHE_LOG_DIR}/hris-access.log combined
</VirtualHost>
